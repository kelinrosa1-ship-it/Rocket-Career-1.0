<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ROCKET CAREER</title>
<style>
:root{--bg:#0b0b12;--card:#15151f;--line:#262636;--tx:#eef;--mut:#8a8aa5;--blue:#3b82f6;--pur:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,Segoe UI,sans-serif}
h1,h2,h3{margin:0 0 10px}.w{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{background:linear-gradient(135deg,var(--blue),var(--pur));color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;margin:2px}
button.g{background:#232334}button:disabled{opacity:.4}
input,select{background:#0e0e17;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;margin:4px 0 10px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bar{height:8px;background:#222;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pur))}
.fc{width:230px;margin:auto;padding:16px;border-radius:18px;background:linear-gradient(160deg,#1e3a8a,#5b21b6 60%,#111);border:2px solid #a78bfa;text-align:center}
.fc .o{font-size:52px;font-weight:900}.fc td{padding:2px 6px;text-align:left}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.mut{color:var(--mut);font-size:13px}canvas{width:100%;background:#0d2a1d;border-radius:12px;border:2px solid var(--line)}
#feed{height:130px;overflow:auto;font-size:13px}.big{font-size:34px;font-weight:900;text-align:center}
.gol{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:#fff;text-shadow:0 0 30px var(--pur);pointer-events:none}
.shell{display:flex;gap:14px}aside{width:200px;flex:none;background:#0f0f19;border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:12px;align-self:flex-start}aside a{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mut);transition:.15s}aside a:hover{background:#1c1c2c;color:#fff;transform:translateX(3px)}aside a.on{background:linear-gradient(90deg,#0891b2,#6d28d9);color:#fff}.gt{font-size:11px;letter-spacing:2px;color:#22d3ee;margin:12px 0 4px}.logo{font-weight:900;letter-spacing:3px}.logo b{color:#22d3ee;display:block}.big2{font-size:42px}main{flex:1;min-width:0}.fade{animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(8px)}}.hero{display:flex;justify-content:space-between;align-items:center;padding:24px;border-radius:18px;background:radial-gradient(circle at 80% 20%,#22d3ee55,transparent 50%),linear-gradient(135deg,#1e3a8a,#4c1d95);margin-bottom:12px}.ovrbig{font-size:80px;font-weight:900;line-height:1;text-align:center}.ovrbig small{display:block;font-size:14px;color:#22d3ee}.card:hover{border-color:#22d3ee66}.nc{border-radius:14px;padding:16px;margin-bottom:10px}.tag{font-size:11px;letter-spacing:1px;opacity:.8}.row{cursor:pointer}.row:hover{background:#1c1c2c}@media(max-width:760px){.shell{flex-direction:column}aside{width:100%;display:flex;overflow-x:auto;position:static;gap:4px}aside .gt,aside .logo{display:none}aside a{white-space:nowrap}.hero{flex-direction:column;text-align:center}}
.lk{color:#67e8f9;cursor:pointer;text-decoration:underline dotted}#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}.mb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto}</style></head><body><div class="w" id="app"></div>
<script>
// ===== DADOS (rosters 2026 aproximados - verifique/edite em TEAMS; OVRs são estimativas fictícias) =====
const TEAMS=[
{n:'Team Falcons',r:'MENA',c:'#16a34a',p:[['Rw9',94],['Kiileerrz',90],['dralii',91]],t:[['RLCS World Championship',2026,'RLCS 2026 Worlds','Rw9, Kiileerrz, dralii'],['Esports World Cup',2025,'EWC 2025','Rw9, Kiileerrz, dralii'],['RLCS World Championship',2025,'RLCS 2025 Worlds','Rw9, Kiileerrz, dralii']]},
{n:'FURIA',r:'SAM',c:'#e5e7eb',p:[['Drufinho',89],['Lostt',88],['Swiftt',85]],t:[['Regional SAM',2025,'RLCS SAM','Drufinho, Lostt, Swiftt']]},
{n:'MIBR',r:'SAM',c:'#22c55e',p:[['Airton',84],['Hayashi',80],['Ayyjayy',82]],t:[]},
{n:'Team Vitality',r:'EU',c:'#facc15',p:[['Zen',92],['Ferra',90],['Monkey Moon',88]],t:[['RLCS World Championship',2024,'RLCS 2024 Worlds','Zen, Ferra, Monkey Moon']]},
{n:'Karmine Corp',r:'EU',c:'#38bdf8',p:[['Atow.',88],['Vatira',87],['Chronic',85]],t:[['Major',2025,'RLCS Major','Atow., Vatira, Chronic']]},
{n:'NRG',r:'NA',c:'#ef4444',p:[['Daniel',91],['Beastmode',89],['Oaly',84]],t:[['RLCS World Championship',2023,'RLCS 2023 Worlds','Daniel, GarrettG, Squishy']]},
{n:'Spacestation',r:'NA',c:'#a855f7',p:[['Rise',83],['Kofi',82],['Ahmad',86]],t:[]},
{n:'G2 Esports',r:'NA',c:'#f97316',p:[['JKnaps',90],['Jstn',88],['Chicago',85]],t:[['Regional NA',2024,'RLCS NA','JKnaps, Jstn, Chicago']]},
{n:'Gen.G',r:'APAC',c:'#eab308',p:[['Reysbull',80],['Majicbear',78],['Wonder',79]],t:[]},
{n:'Twisted Minds',r:'MENA',c:'#e11d48',p:[['AbdullahH',86],['Trk511',84],['Retals',83]],t:[]}];
const ATTR=['Mecânica','Controle','Chute','Passe','Defesa','Velocidade','Posicionamento','Leitura','Consistência','Decisão','Equipe'];
const cat=o=>o>=95?'Lenda':o>=90?'Elite':o>=85?'Estrela':o>=80?'Alto nível':o>=75?'Profissional':o>=70?'Semi-pro':'Amador';
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[ri(0,a.length-1)];
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem('rc_save')||'null'),tab='over',view=S?'menu':'menu',draft={};
const save=()=>{try{localStorage.setItem('rc_save',JSON.stringify(S))}catch(e){}};
const ovr=a=>Math.round(ATTR.reduce((s,k)=>s+a[k],0)/ATTR.length);
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
function news(t){S.news.unshift(`[${S.season}] ${t}`);S.news=S.news.slice(0,40)}
function msg(f,t){S.inbox.unshift({f,t,s:S.season});S.inbox=S.inbox.slice(0,30)}
function newCareer(d){
 const st={Mecânico:'Mecânica',Playmaker:'Passe',Agressivo:'Chute',Defensivo:'Defesa',Versátil:'Controle'}[d.style];
 const base=ri(65,70),a={};ATTR.forEach(k=>a[k]=base+ri(-3,3));a[st]+=5;
 S={p:{...d,a,xp:0,lvl:1,pts:0,rep:20,money:5000,en:100,form:50,st:{g:0,a:0,sh:0,sv:0,m:0,mvp:0,w:0,l:0},titles:[]},team:null,role:'Reserva',contract:{y:1,sal:2000},season:2026,match:0,
 tp:Object.fromEntries(TEAMS.map(t=>[t.n,0])),teams:JSON.parse(JSON.stringify(TEAMS)),news:[],inbox:[],offers:[],hist:[],trophies:[]};
}
function myOvr(){return ovr(S.p.a)}
function tOvr(t){const l=t.p.map(x=>x[1]);return Math.round(l.reduce((a,b)=>a+b,0)/l.length)}
function lineup(t){const m=t.n===S.team;let L=t.p.map(x=>({n:x[0],o:x[1]}));if(m&&S.role==='Titular'){L=L.sort((a,b)=>a.o-b.o);L[0]={n:S.p.nick,o:myOvr(),me:1}}else if(m)L.forEach(x=>x);return L}
// ===== RENDER =====
function R(){const A=$('app');
 if(view==='menu')A.innerHTML=`<h1>🚀 ROCKET CAREER</h1><p class="mut">Simulador de modo carreira. Projeto de fã — não oficial, sem vínculo com Psyonix/Rocket League. OVRs são estimativas fictícias.</p><div class="card">${S?`<b>${S.p.nick}</b> • ${S.team||'sem equipe'} • ${S.season}<br><button onclick="view='hub';R()">Continuar</button><button class="g" onclick="if(confirm('Excluir?')){S=null;localStorage.removeItem('rc_save');R()}">Excluir carreira</button>`:''}<button onclick="view='create';R()">Nova carreira</button></div>`;
 else if(view==='create')A.innerHTML=`<h2>Criar jogador</h2><div class="card">Nome<input id=nm>Nickname<input id=nk>País<input id=ct value="Brasil">Idade<input id=ag type=number value=19 min=15 max=35>Estilo<select id=sy>${['Mecânico','Playmaker','Agressivo','Defensivo','Versátil'].map(x=>`<option>${x}`)}</select>Modo / Era<select id=era><option>Atual (2026)</option><option disabled>Histórico 2022–2025 (em breve)</option></select><button onclick="mk()">Avançar</button></div>`;
 else if(view==='team')A.innerHTML=`<h2>Escolha sua equipe</h2><p class="mut">Você começa como Reserva e luta pela vaga de titular.</p><div class="grid">${TEAMS.map(t=>`<div class="card" style="border-color:${t.c}"><h3>${t.n}</h3><span class="mut">${t.r} • OVR ${tOvr(t)}</span><br>${t.p.map(x=>x[0]).join(', ')}<br><button onclick="pickTeam('${t.n}')">Assinar</button></div>`).join('')}</div>`;
 else if(view==='hub')hub();
 else if(view==='match')matchView();}
window.mk=()=>{const d={name:$('nm').value||'Jogador',nick:$('nk').value||'Rookie',country:$('ct').value,age:+$('ag').value,style:$('sy').value};newCareer(d);view='team';R()}
window.pickTeam=n=>{S.team=n;S.role='Reserva';news(`${S.p.nick} assina com ${n}.`);msg('Manager',`Bem-vindo à ${n}! Treine e jogue para virar titular.`);save();view='hub';R()}
function card(){const p=S.p,o=myOvr();return`<div class="fc"><div class="mut">${p.country}</div><div class="o">${o}</div><b style="font-size:22px">${p.nick.toUpperCase()}</b><div class="mut">${cat(o)} • ${S.team} • ${p.style}</div><table>${ATTR.map(k=>`<tr><td>${k.toUpperCase()}</td><td><b>${p.a[k]}</b></td></tr>`).join('')}</table></div>`}
function hubOld(){const p=S.p,xpn=p.lvl*300;
 const tabs={over:'Visão geral',train:'Treino',match:'Partida',card:'Carta',team:'Equipe',mkt:'Mercado',inbox:'Caixa',news:'Notícias',trof:'Troféus',rank:'Ranking',hof:'Hall da Fama'};
 let b='';
 if(tab==='over')b=`<div class="grid"><div class="card"><h3>${p.name} "${p.nick}"</h3>OVR <b>${myOvr()}</b> (${cat(myOvr())})<br>Idade ${p.age} • Equipe ${S.team} (${S.role})<br>Contrato ${S.contract.y}a • ${money(S.contract.sal)}/mês<br>Dinheiro ${money(p.money)}<br>Reputação ${p.rep}/100<div class="bar"><i style="width:${p.rep}%"></i></div></div><div class="card">Nível ${p.lvl}<br>${p.xp}/${xpn} XP<div class="bar"><i style="width:${p.xp/xpn*100}%"></i></div><br>Pontos de atributo: <b>${p.pts}</b><br>Energia ${p.en}%<div class="bar"><i style="width:${p.en}%"></i></div>Forma ${p.form}</div><div class="card"><h3>Estatísticas</h3>Jogos ${p.st.m} • V ${p.st.w} D ${p.st.l}<br>Gols ${p.st.g} • Assist ${p.st.a}<br>Chutes ${p.st.sh} • Saves ${p.st.sv}<br>MVPs ${p.st.mvp} • Títulos ${p.titles.length}</div></div><div class="card">Temporada ${S.season}: jogo ${S.match}/${oppList().length}</div>`;
 if(tab==='train')b=`<div class="card"><h3>Treinamento</h3><p class="mut">Cada treino custa 25% de energia e rende ganhos pequenos. Descanse para recuperar.</p>${ATTR.map(k=>`<button onclick="train('${k}')">${k} (${p.a[k]})</button>`).join('')}<br><button class="g" onclick="rest()">Descansar</button></div><div class="card"><h3>Pontos de atributo: ${p.pts}</h3>${ATTR.map(k=>`<button class="g" ${p.pts<1?'disabled':''} onclick="spend('${k}')">+1 ${k}</button>`).join('')}</div>`;
 if(tab==='match'){const o=oppList()[S.match];b=o?`<div class="card"><h3>Próxima partida</h3>${S.team} (${tOvr(cur())}) × ${o} (${tOvr(tm(o))})<br><span class="mut">${S.match>=oppList().length-1?'Final da temporada!':'RLCS (liga simulada)'}</span><br><button onclick="startMatch()">Assistir transmissão</button></div>`:`<div class="card"><h3>Temporada ${S.season} encerrada</h3><button onclick="endSeason()">INICIAR TEMPORADA ${S.season+1}</button></div>`}
 if(tab==='card')b=card();
 if(tab==='team')b=`<div class="card"><h3>${S.team} — elenco</h3><table>${lineup(cur()).map(x=>`<tr><td>${PL(x.n)}${x.me?' ⭐':''}</td><td>${x.o}</td></tr>`).join('')}${S.role==='Reserva'?`<tr><td>${p.nick} (reserva)</td><td>${myOvr()}</td></tr>`:''}</table>Sinergia/OVR do time: ${tOvr(cur())}<br><span class="mut">Papel: ${S.role}. Titular exige OVR acima do mais fraco do elenco.</span></div>`;
 if(tab==='mkt')b=`<div class="card"><h3>Ofertas</h3>${S.offers.length?S.offers.map((o,i)=>`<div class="card"><b>${o.t}</b> — ${o.y} anos • ${money(o.sal)}/mês • Bônus ${money(o.bonus)} • ${o.role}<br><button onclick="offer(${i},'a')">Aceitar</button><button class="g" onclick="offer(${i},'n')">Negociar</button><button class="g" onclick="offer(${i},'r')">Recusar</button></div>`).join(''):'Nenhuma oferta no momento. Suba OVR e reputação.'}</div>`;
 if(tab==='inbox')b=`<div class="card">${S.inbox.map(m=>`<p><b>${m.f}</b> (${m.s}): ${m.t}</p>`).join('')||'Vazia'}</div>`;
 if(tab==='news')b=`<div class="card">${S.news.map(n=>`<p>📰 ${n}</p>`).join('')||'Sem notícias'}</div>`;
 if(tab==='trof')b=`<div class="card"><h3>Seus troféus</h3>${S.trophies.map(t=>'🏆 '+t).join('<br>')||'Nenhum ainda'}</div>`+S.teams.map(t=>`<div class="card"><h3>${t.n}</h3>${t.t.length?t.t.map(x=>`<details><summary>🏆 ${x[0]} — ${x[1]}</summary>Evento: ${x[2]}<br>Elenco: ${x[3]}</details>`).join(''):'<span class="mut">Sem troféus registrados</span>'}</div>`).join('');
 if(tab==='rank'){const r=S.teams.map(t=>({n:t.n,r:t.r,o:tOvr(t),p:S.tp[t.n],t:t.t.length})).sort((a,b)=>b.p-a.p||b.o-a.o);b=`<div class="card"><table><tr><th>#<th>Equipe<th>Reg<th>OVR<th>Pts<th>Títulos</tr>${r.map((x,i)=>`<tr><td>${i+1}<td>${TL(x.n)}<td>${x.r}<td>${x.o}<td>${x.p}<td>${x.t}</tr>`).join('')}</table></div>`}
 if(tab==='hof')b=`<div class="card"><h3>Hall da Fama</h3>${S.hist.map(h=>`Temporada ${h.s}: ${h.t} — ${h.pos}º lugar • OVR ${h.o}`).join('<br>')||'Sua história começa agora.'}<br><br>Lendas (OVR 95+): ${myOvr()>=95?p.nick+' ⭐':'nenhuma ainda — será você?'}</div>`;
 return b}
const tm=n=>S.teams.find(t=>t.n===n),cur=()=>tm(S.team);
function oppList(){if(!S._o||S._os!==S.season){S._o=S.teams.filter(t=>t.n!==S.team).map(t=>t.n).sort(()=>Math.random()-.5).slice(0,8);S._os=S.season}return S._o}
window.train=k=>{const p=S.p;if(p.en<25)return alert('Sem energia!');p.en-=25;if(Math.random()<.6&&p.a[k]<99)p.a[k]++;p.xp+=40;lv();save();R()}
window.rest=()=>{S.p.en=100;save();R()}
window.spend=k=>{if(S.p.pts>0&&S.p.a[k]<99){S.p.pts--;S.p.a[k]++;save();R()}}
function lv(){const p=S.p;while(p.xp>=p.lvl*300){p.xp-=p.lvl*300;p.lvl++;p.pts+=2;news(`${p.nick} sobe para o nível ${p.lvl}!`)}}
function offers(){if(S.offers.length>2)return;const o=myOvr(),r=S.p.rep;const c=S.teams.filter(t=>t.n!==S.team&&tOvr(t)<=o+8+r/10);if(c.length&&Math.random()<.3+r/200){const t=pick(c);S.offers.push({t:t.n,y:ri(1,3),sal:Math.round((o*60+r*40)*rnd(.9,1.3)),bonus:ri(2,10)*1000,role:o>=tOvr(t)-3?'Titular':'Reserva'});msg('Agente',`Recebemos uma proposta da ${t.n}.`);news(`${S.p.nick} recebe proposta da ${t.n}.`)}}
window.offer=(i,a)=>{const o=S.offers[i];if(a==='r')S.offers.splice(i,1);else if(a==='n'){if(Math.random()<.5+S.p.rep/200){o.sal=Math.round(o.sal*1.15);alert('Eles aceitaram melhorar o salário!')}else{alert('A org desistiu.');S.offers.splice(i,1)}}else{S.team=o.t;S.role=o.role;S.contract={y:o.y,sal:o.sal};S.p.money+=o.bonus;news(`${S.p.nick} assina com ${o.t}.`);msg('Organização',`Bem-vindo à ${o.t}!`);S.offers=[];S._o=null}save();R()}
// ===== PARTIDA 2D =====
let M=null;
window.startMatch=()=>{const a=cur(),b=tm(oppList()[S.match]);if(S.role==='Reserva'&&myOvr()>Math.min(...a.p.map(x=>x[1]))){S.role='Titular';msg('Técnico','Você ganhou a vaga de titular!');news(`${S.p.nick} vira titular da ${S.team}.`)}
 const mk=(t,side)=>lineup(t).map((x,i)=>({...x,side,i,x:side?800-120-i*60:120+i*60,y:150+(i-1)*70,vx:0,vy:0,g:0,a:0,sh:0,sv:0}));
 M={A:a,B:b,pl:[...mk(a,0),...mk(b,1)],ball:{x:400,y:150,vx:0,vy:0},sc:[0,0],t:300,run:false,sp:1,ev:[],last:null,pause:0,stats:null,done:false,en:S.p.en/100};view='match';R()}
function ev(t){M.ev.unshift(`${fmt(M.t)} — ${t}`)}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function matchView(){$('app').innerHTML=`<div class="card" style="position:relative"><div class="big" id=sb></div><canvas id=cv width=800 height=300></canvas><div class="gol" id=gl style="display:none">GOOOOOL!</div><div><button id=pp onclick="M.run=!M.run">▶/⏸</button><button class="g" onclick="M.sp=1">1×</button><button class="g" onclick="M.sp=2">2×</button><button class="g" onclick="M.sp=4">4×</button><button class="g" onclick="nextEv()">PRÓXIMO EVENTO</button></div><div id=feed class="mut"></div></div>`;M.run=true;loop()}
window.nextEv=()=>{const n=M.ev.length;let g=0;while(M.ev.length===n&&M.t>0&&g++<5000)step()}
function step(){const B=M.ball,dt=.1;M.t-=dt;
 const mine=s=>M.pl.filter(p=>p.side===s);
 for(const s of[0,1]){const T=mine(s).sort((a,b)=>Math.hypot(a.x-B.x,a.y-B.y)-Math.hypot(b.x-B.x,b.y-B.y));T.forEach((p,r)=>{const sk=p.o/100,dir=s?-1:1;let tx,ty;
  if(r===0){tx=B.x;ty=B.y}else{tx=B.x-dir*(r*90+(1-sk)*40)*(1);ty=150+(r===1?-60:60)*(1-sk*.3);if(Math.abs(tx-(s?800:0))<60)tx=(s?740:60)}
  const sp=1.6+sk*1.5,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*sp*.3;p.vy+=dy/d*sp*.3;p.vx*=.8;p.vy*=.8;p.x=Math.max(10,Math.min(790,p.x+p.vx));p.y=Math.max(10,Math.min(290,p.y+p.vy));
  if(r===0&&Math.hypot(p.x-B.x,p.y-B.y)<16&&Math.random()<.15+sk*.2){const gx=s?0:800,gy=150+rnd(-40,40)+(1-sk)*rnd(-90,90);const near=Math.abs(p.x-gx)<320;const k=Math.hypot(gx-p.x,gy-p.y)||1;const pw=near?7+sk*4:5+sk*3;
   if(near){p.sh++;ev(`${p.n} chuta!`)}else if(Math.random()<.3){const m=T[1];B.vx=(m.x-p.x)/20;B.vy=(m.y-p.y)/20;M.last=p;ev(`${p.n} tenta o passe.`);return}
   B.vx=(gx-p.x)/k*pw;B.vy=(gy-p.y)/k*pw;M.last=p}})}
